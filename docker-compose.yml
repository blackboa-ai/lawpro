version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: lawpro-db
    environment:
      POSTGRES_USER: lawpro
      POSTGRES_PASSWORD: lawpro123
      POSTGRES_DB: lawpro
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lawpro"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lawpro-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://lawpro:lawpro123@db:5432/lawpro
      - SECRET_KEY=dev-secret-key-change-in-production
      - BACKEND_HOST=http://0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data: